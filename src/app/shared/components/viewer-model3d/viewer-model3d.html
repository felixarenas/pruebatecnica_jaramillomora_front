<div #viewerHost class="viewer-model3d" [style.--viewer-height]="height()">
  @if (showToolbar()) {
  <div class="viewer-model3d__toolbar" role="toolbar" aria-label="Herramientas del visor 3D">
    <button nz-button nzType="default" nzSize="small" nz-tooltip nzTooltipTitle="Ajustar a la vista"
      [disabled]="loading() || !hasModel()" (click)="fitToView()">
      <nz-icon nzType="aim" nzTheme="outline"></nz-icon>
    </button>

    <button nz-button nzType="default" nzSize="small" nz-tooltip nzTooltipTitle="Restablecer cámara"
      [disabled]="loading()" (click)="resetCamera()">
      <nz-icon nzType="reload" nzTheme="outline"></nz-icon>
    </button>

    <button nz-button nzType="default" nzSize="small" nz-tooltip
      [nzTooltipTitle]="isFullscreen() ? 'Salir de pantalla completa' : 'Pantalla completa'"
      (click)="toggleFullscreen()">
      <nz-icon [nzType]="isFullscreen() ? 'compress' : 'expand'" nzTheme="outline"></nz-icon>
    </button>
  </div>
  }

  <div class="viewer-model3d__stage">
    <div #viewerContainer class="viewer-model3d__canvas"></div>

    @if (loadingProgress() !== null) {
    <div class="viewer-model3d__progress" role="progressbar" aria-label="Progreso de carga del modelo 3D"
      [attr.aria-valuenow]="loadingProgress()" aria-valuemin="0" aria-valuemax="100">
      <div class="viewer-model3d__progress-bar" [style.width.%]="loadingProgress()"></div>
    </div>
    }

    @if (loading()) {
    <div class="viewer-model3d__overlay">
      <nz-spin nzSimple [nzTip]="'Cargando modelo IFC…'"></nz-spin>
    </div>
    }

    @if (errorMessage(); as message) {
    <div class="viewer-model3d__overlay viewer-model3d__overlay--error" role="alert">
      <p>{{ message }}</p>
    </div>
    }

    @if (!loading() && !errorMessage() && !modelUrl()) {
    <div class="viewer-model3d__overlay viewer-model3d__overlay--empty">
      <p>Seleccione un archivo IFC para visualizar.</p>
    </div>
    }
  </div>
</div>
