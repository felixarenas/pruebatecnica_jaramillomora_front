<nz-layout class="symphony-layout">
  <nz-sider
    class="symphony-sider"
    nzCollapsible
    [(nzCollapsed)]="isCollapsed"
    [nzTrigger]="null"
    [nzWidth]="260"
    [nzCollapsedWidth]="72"
    nzBreakpoint="lg"
    [nzZeroTrigger]="null"
  >
    <div class="symphony-logo" [class.collapsed]="isCollapsed">
      @if (!isCollapsed) {
        <img src="assets/images/logo-dark.svg" alt="Symphony" />
        <span>Symphony</span>
      } @else {
        <img src="assets/images/logo-dark.svg" alt="Symphony" class="logo-icon" />
      }
    </div>

    <ul nz-menu nzMode="inline" [nzInlineCollapsed]="isCollapsed" class="symphony-menu">
      <li nz-menu-item nzMatchRouter routerLink="/home">
        <nz-icon nzType="home" />
        <span>Inicio</span>
      </li>
      <li nz-submenu nzTitle="Gestión" nzIcon="appstore">
        <ul>
          <li nz-menu-item nzMatchRouter routerLink="/clientes">
            <span>Clientes</span>
          </li>
          <li nz-menu-item nzMatchRouter routerLink="/servicios">
            <span>Servicios</span>
          </li>
          <li nz-menu-item nzMatchRouter routerLink="/cliente-servicios">
            <span>Cliente-Servicios</span>
          </li>
        </ul>
      </li>
      <li nz-submenu nzTitle="Administración" nzIcon="setting">
        <ul>
          <li nz-menu-item nzDisabled>
            <span>Usuarios</span>
          </li>
          <li nz-menu-item nzDisabled>
            <span>Configuración</span>
          </li>
        </ul>
      </li>
    </ul>
  </nz-sider>

  <nz-layout class="symphony-main">
    <nz-header class="symphony-header">
      <div class="header-left">
        <button
          type="button"
          class="menu-trigger"
          (click)="isCollapsed = !isCollapsed"
          [attr.aria-label]="isCollapsed ? 'Expandir menú' : 'Colapsar menú'"
        >
          <nz-icon [nzType]="isCollapsed ? 'menu-unfold' : 'menu-fold'" />
        </button>
        <span class="header-title">Panel de control</span>
      </div>
      <div class="header-right">
        <nz-icon nzType="bell" class="header-icon" />
        <div
          class="user-avatar"
          nz-dropdown
          [nzDropdownMenu]="userMenu"
          nzTrigger="click"
          nzPlacement="bottomRight"
          nzOverlayClassName="symphony-user-dropdown"
        >
          <nz-icon nzType="user" />
        </div>
        <nz-dropdown-menu #userMenu="nzDropdownMenu">
          <div class="user-dropdown-panel">
            <div class="user-dropdown-field">
              <span class="user-dropdown-label">Nombre</span>
              <span class="user-dropdown-value">{{ authUser()?.full_name ?? '—' }}</span>
            </div>
            <div class="user-dropdown-field">
              <span class="user-dropdown-label">Correo</span>
              <span class="user-dropdown-value">{{ authUser()?.email ?? '—' }}</span>
            </div>
            <button
              type="button"
              class="user-dropdown-logout"
              (click)="logout()"
            >
              Cerrar sesión
            </button>
          </div>
        </nz-dropdown-menu>
      </div>
    </nz-header>

    <nz-content class="symphony-content">
      <div class="inner-content">
        <router-outlet />
      </div>
    </nz-content>

    <nz-footer class="symphony-footer">
      Symphony © {{ date.getFullYear() }}
    </nz-footer>
  </nz-layout>
</nz-layout>
